name: Update Klaviyo data

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días 09:00 UTC — ajustar a gusto
  workflow_dispatch: {}     # botón "Run workflow" manual

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          KLAVIYO_SNAPSHOT_SHEET_ID: ${{ secrets.KLAVIYO_SNAPSHOT_SHEET_ID }}
        run: python scripts/fetch_sheet_data.py

      - name: Fetch data from Klaviyo API
        env:
          KLAVIYO_API_KEY_CORRO: ${{ secrets.KLAVIYO_API_KEY_CORRO }}
          KLAVIYO_API_KEY_CAVALI: ${{ secrets.KLAVIYO_API_KEY_CAVALI }}
        run: python scripts/fetch_klaviyo_api.py

      - name: Generate API vs. Google Sheet validation report
        run: python scripts/generate_validation_report.py

      - name: Commit updated data
        run: |
          git config user.name "clavijo-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json data/klaviyo_api_data.json reports/klaviyo_validation_report.md
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "chore: actualizar datos [automǭtico]"
          git push
